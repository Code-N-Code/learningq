spring.application.name=learningq

# Web MVC
server.port=${PORT:8080}
spring.jackson.property-naming-strategy=SNAKE_CASE
# Validation needs @Valid / @Validated in Java; no extra properties are required.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# MariaDB: use its native JDBC driver and URL for the hosted MariaDB 11.8 server.
# DB_URL overrides the whole URL. Otherwise, the DB_* fields below build it.
# SSL is disabled for the current connection troubleshooting setup.
# Set DB_SSL_MODE=verify-full for production with a trusted, matching certificate.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# JPA: Hibernate only validates entity mappings; it does not create tables.
# Flyway is deferred. Create required tables before adding mapped entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Hibernate detects the MariaDB dialect from the database connection.


# Spring Session JDBC: its database tables must exist before using sessions.
# Automatic schema creation remains off; migration setup is deferred.
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=SPRING_SESSION
spring.session.timeout=${SESSION_IDLE_TIMEOUT:7d}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=${SESSION_COOKIE_MAX_AGE:30d}
# Cookie lifetime does not enforce an absolute server-side session lifetime.

# Mail: defaults target STARTTLS SMTP on port 587. Set provider credentials in
# the environment. The local profile uses a local mail catcher instead.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_STARTTLS_ENABLED:true}
spring.mail.properties[mail.smtp.starttls.required]=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties[mail.smtp.ssl.checkserveridentity]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
spring.mail.test-connection=false

# Security: starter defaults remain until a SecurityFilterChain is implemented.
# Do not put account passwords in spring.security.user.* properties.

